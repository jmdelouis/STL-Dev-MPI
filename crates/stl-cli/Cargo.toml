[package]
name = "stl-cli"
description = "Command-line tools: stl-synth (synthesis of HEALPix maps from ScatCov statistics), stl-synth2d (planar images), stl-stats, stl-minkowski"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Run under mpirun (MPI_COMM_WORLD); without it, --ranks N runs N thread ranks.
mpi = ["dep:mpi", "stl-mpi/mpi"]
# --gpu: one CUDA device per rank (crate stl-gpu).
gpu = ["dep:stl-gpu"]

[dependencies]
stl-core = { path = "../stl-core" }
stl-mpi = { path = "../stl-mpi" }
stl-gpu = { path = "../stl-gpu", optional = true }
num-complex.workspace = true
serde_json.workspace = true
libm = "0.2"
mpi = { workspace = true, optional = true }

[[bin]]
name = "stl-synth"
path = "src/bin/stl-synth.rs"

[[bin]]
name = "stl-minkowski"
path = "src/bin/stl-minkowski.rs"

[[bin]]
name = "stl-ensemble"
path = "src/bin/stl-ensemble.rs"

[[bin]]
name = "stl-synth2d"
path = "src/bin/stl-synth2d.rs"

[[bin]]
name = "stl-stats"
path = "src/bin/stl-stats.rs"
